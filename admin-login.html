<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | RideWithEdwinSpeed</title>
  <link rel="stylesheet" href="admin-login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card">
      <img src="logo.png" alt="RideWithEdwinSpeed" class="login-logo">
      <h1>Owner Login</h1>
      <p class="subtitle">Secure access to your RideWithEdwinSpeed booking dashboard.</p>

      <form id="loginForm">
        <label for="email">Admin email</label>
        <input id="email" name="email" type="email" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" id="loginButton">Sign in</button>
        <p id="loginMessage" class="message" role="alert"></p>
      </form>

      <a href="index.html" class="back-link">← Back to website</a>
    </section>
  </main>
  <script src="admin-login.js"></script>
</body>
</html>
